---
# Scoped to the insurance-lakehouse/ subtree so the unrelated hackathon project
# in this repository is unaffected (see ADR-0001).
name: insurance-lakehouse CI

on:
  push:
    branches: [main]
    paths: ['insurance-lakehouse/**', '.github/workflows/insurance-lakehouse-ci.yml']
  pull_request:
    paths: ['insurance-lakehouse/**', '.github/workflows/insurance-lakehouse-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: insurance-lakehouse

env:
  # Small enough to keep CI to a few minutes, large enough that every defect
  # the generator injects still appears at least once.
  LAKEHOUSE_N_POLICIES: '2000'
  PII_SALT: ci-salt-not-a-real-secret
  DBT_TARGET: local

jobs:
  lint:
    name: lint (ruff, sqlfluff, yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: insurance-lakehouse/pyproject.toml
      - name: Install lint tooling
        run: pip install "ruff>=0.16,<0.17" "sqlfluff>=4.3,<5.0" "yamllint>=1.38,<2.0"
      - run: ruff check .
      - run: ruff format --check .
      - run: yamllint -c .yamllint.yml .
      # sqlfluff uses the jinja templater, so this needs no warehouse and no
      # compiled manifest -- it is a second, not a minute.
      - run: sqlfluff lint dbt/

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          # Spark 3.5 supports Java 8/11/17 only; 21 fails at runtime with an
          # obscure reflection error rather than a clear version message.
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: insurance-lakehouse/pyproject.toml
      - name: Cache Delta JARs
        uses: actions/cache@v4
        with:
          # Without this every run re-resolves delta-spark from Maven Central,
          # which is the slowest step in the job.
          path: ~/.ivy2
          key: ivy-delta-3.3.3-${{ runner.os }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fast tests
        run: pytest tests/ -m "not slow" -q
      - name: Spark-backed tests
        run: pytest tests/ -m slow -q

  pipeline:
    name: end-to-end pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: insurance-lakehouse/pyproject.toml
      - name: Cache Delta JARs
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-delta-3.3.3-${{ runner.os }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: dbt deps
        run: make dbt-deps

      # Day 1 then day 2, which is what exercises deduplication, late-arriving
      # claims, schema drift and the SCD2 snapshot. A single day would build
      # green while proving none of it.
      - name: Generate day 1 and ingest
        run: make data DAY=1 && make bronze
      - name: Ingest again (idempotency)
        run: |
          make bronze | tee /tmp/second.log
          grep -q "UP_TO_DATE" /tmp/second.log \
            || { echo "Re-ingest was not idempotent"; exit 1; }
      - name: dbt build (day 1)
        run: make dbt-build
      - name: Generate day 2 and ingest
        run: make data DAY=2 && make bronze
      - name: dbt build (day 2)
        run: make dbt-build
      - name: Observability report
        run: make report
      - name: Demo proof
        run: python scripts/demo_proof.py

      - name: Upload dbt artifacts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-and-report
          path: |
            insurance-lakehouse/dbt/target/run_results.json
            insurance-lakehouse/dbt/target/manifest.json
            insurance-lakehouse/reports/observability.html
          retention-days: 14
          if-no-files-found: warn

  dag:
    name: airflow DAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Airflow
        run: |
          pip install "apache-airflow==3.3.2" \
            "apache-airflow-providers-standard" "astronomer-cosmos==1.15.1"
      - name: DAG imports without errors
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/insurance-lakehouse/lakehouse/airflow_home
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/insurance-lakehouse/airflow/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
        run: |
          mkdir -p "$AIRFLOW_HOME"
          airflow db migrate >/dev/null
          airflow dags reserialize
          # list-import-errors exits 0 even with errors, so assert on output.
          airflow dags list-import-errors 2>&1 | tee /tmp/errs.log
          grep -q "No data found" /tmp/errs.log \
            || { echo "DAG import errors found"; exit 1; }
