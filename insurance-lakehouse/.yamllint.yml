extends: default
ignore: |
  .venv/
  .venv-airflow/
  lakehouse/
  reports/
  dbt/target/
  dbt/dbt_packages/
  dbt/package-lock.yml
  airflow/.astro/
  # Generated by `astro dev init`; not edited by hand.
  airflow/airflow_settings.yaml
rules:
  line-length:
    max: 120
    level: warning
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start: disable
