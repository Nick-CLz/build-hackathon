# Spark configuration for BOTH the PySpark ingestion jobs and dbt-spark's
# session method. The Makefile exports SPARK_CONF_DIR=<repo>/conf so that one
# file is the single source of truth -- see docs/decisions.md ADR-0003 for why
# this indirection exists (dbt-spark's session method builds its own
# SparkSession and offers no hook for these settings).
#
# NOTE: spark-defaults.conf does not expand environment variables. Relative
# paths resolve against the working directory, which is always the project root.

# --- Delta Lake -----------------------------------------------------------
# On first run this resolves from Maven Central into ~/.ivy2. The Docker image
# pre-fetches it so containers start offline.
spark.jars.packages                 io.delta:delta-spark_2.12:3.3.3
spark.sql.extensions                io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog     org.apache.spark.sql.delta.catalog.DeltaCatalog

# --- Local execution ------------------------------------------------------
spark.master                        local[*]
spark.driver.memory                 4g
spark.sql.warehouse.dir             lakehouse/warehouse
spark.driver.extraJavaOptions       -Dderby.system.home=lakehouse/metastore

# --- Laptop tuning --------------------------------------------------------
# Stock defaults assume a cluster. On a laptop a 200-way shuffle (or VACUUM's
# 10,000-partition file listing) dominates runtime on tables of this size.
spark.sql.shuffle.partitions        4
spark.default.parallelism           4
spark.databricks.delta.snapshotPartitions  4
spark.sql.sources.parallelPartitionDiscovery.parallelism  4
spark.ui.enabled                    false
# Progress bars are written with carriage returns and corrupt any piped output,
# including the proof that `make demo` prints.
spark.ui.showConsoleProgress        false
spark.sql.adaptive.enabled          true
spark.sql.adaptive.coalescePartitions.enabled  true

# Timestamps written by Spark 2.x-era tools; be permissive on rebasing rather
# than failing the read.
spark.sql.parquet.datetimeRebaseModeInRead   CORRECTED
spark.sql.parquet.datetimeRebaseModeInWrite  CORRECTED

# Delta retention checks are a production guard-rail; the maintenance demo needs
# to VACUUM with zero retention to show the effect within one run.
spark.databricks.delta.retentionDurationCheck.enabled  false
