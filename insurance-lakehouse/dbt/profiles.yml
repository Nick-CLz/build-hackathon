---
# Two targets, one project. `local` is the default and the CI path; `databricks`
# is exercised against a real workspace. No secrets live here -- every
# Databricks value comes from the environment (see .env.example).
insurance_lakehouse:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:

    # PySpark in-process. Delta configuration arrives via SPARK_CONF_DIR
    # because dbt-spark's session method builds its own SparkSession
    # (docs/decisions.md ADR-0003).
    local:
      type: spark
      method: session
      host: localhost
      schema: silver
      threads: 1

    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'insurance_dev') }}"
      schema: silver
      threads: 4
