---
# The repo is bind-mounted, so edits on the host take effect immediately and
# generated data under lakehouse/ is visible from both sides.
services:
  lakehouse:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Empty by default; set only on networks that intercept TLS.
        EXTRA_CA_BUNDLE: "${EXTRA_CA_BUNDLE:-}"
    image: insurance-lakehouse:local
    container_name: insurance-lakehouse
    working_dir: /workspace
    environment:
      # JAVA_HOME is deliberately NOT set here. The image already points it at
      # its own JDK; overriding it from compose silently breaks Spark with
      # "Java gateway process exited" if the two ever disagree.
      SPARK_CONF_DIR: /workspace/conf
      LAKEHOUSE_SEED: "${LAKEHOUSE_SEED:-42}"
      LAKEHOUSE_N_POLICIES: "${LAKEHOUSE_N_POLICIES:-20000}"
      PII_SALT: "${PII_SALT:-change-me-local-only}"
    volumes:
      - ../:/workspace
      # Named volume keeps the Ivy cache (Delta JARs) across container restarts.
      - ivy-cache:/root/.ivy2
    # Spark's driver needs more shared memory than Docker's 64MB default.
    shm_size: 1gb
    stdin_open: true
    tty: true
    command: bash

volumes:
  ivy-cache:
