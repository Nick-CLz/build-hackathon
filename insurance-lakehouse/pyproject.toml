[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-lakehouse"
version = "0.1.0"
description = "Reusable local Databricks-style insurance lakehouse skeleton"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==3.5.9",
    "delta-spark==3.3.3",
    "dbt-core==1.12.5",
    "dbt-spark[session]==1.11.0",
    "Faker>=40,<41",
    "PyYAML>=6,<7",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
databricks = [
    "dbt-databricks==1.12.5",
    "databricks-sdk>=0.68,<1.0",
    "databricks-sql-connector>=4.0,<5.0",
]
dev = [
    "pytest>=9.0,<10.0",
    "ruff>=0.16,<0.17",
    "sqlfluff>=4.3,<5.0",
    "sqlfluff-templater-dbt>=4.3,<5.0",
    "yamllint>=1.38,<2.0",
    "pre-commit>=4.6,<5.0",
]

[project.scripts]
generate-data = "data_generator.cli:main"

[tool.setuptools.packages.find]
include = ["data_generator*", "ingestion*", "governance*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/dbt_packages", "lakehouse", "airflow/dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: requires a SparkSession"]
